services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: fretenow
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: fretenow
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fretenow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fretenow -d fretenow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fretenow_postgres:
