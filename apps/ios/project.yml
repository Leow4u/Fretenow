name: FreteNow
options:
  bundleIdPrefix: com.fretenow
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  FreteNow:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fretenow.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FreteNow Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          INFOPLIST_FILE: Config/Debug-Info.plist
        Release:
          INFOPLIST_FILE: Config/Release-Info.plist
  FreteNowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FreteNow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FreteNow:
    build:
      targets:
        FreteNow: all
    test:
      config: Debug
      targets: [FreteNowTests]
