name: FreteNow CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fretenow
          POSTGRES_PASSWORD: local-demo-ci-only
          POSTGRES_DB: fretenow
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U fretenow' --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fretenow:local-demo-ci-only@127.0.0.1:5432/fretenow
      APP_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
      - run: npm run typecheck
      - run: npm run typecheck:web
      - run: npm run test:flow --workspace=@fretenow/web
      - name: Web adapter against local API
        env:
          WEB_ORIGIN: http://127.0.0.1:3002
        run: |
          npm run start:api > "$RUNNER_TEMP/fretenow-api.log" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4100/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:api --workspace=@fretenow/web
      - run: npm run build:web
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/tests/
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install mint
      - run: mint run yonaskolb/XcodeGen@2.44.1 xcodegen generate
        working-directory: apps/ios
      - name: Choose available iOS simulator and run tests
        working-directory: apps/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS-18-5" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -project FreteNow.xcodeproj -scheme FreteNow -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath build/TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            apps/ios/build/TestResults.xcresult
            apps/ios/build/Build/Products/Debug-iphonesimulator/*.app
